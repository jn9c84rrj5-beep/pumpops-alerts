<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Questions</title>
<meta name="theme-color" content="#05080d">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Questions">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="icon" href="../icon-192.png">
<style>
  /* THE STAFF QUESTIONS PAGE (R190): a man's questions about his own messages; the answer goes in the WhatsApp group. Dark always. No data in this file. */
  :root {
    color-scheme: dark;
    --page: #05080d; --card: #141c2a; --card-late: #33270c; --edge: rgba(255, 255, 255, .13); --edge-late: #fbbf24;
    --ink: #f4f7fb; --body: #b4bfd0; --primary: #22c55e; --primary-on: #04210f; --ok: #86efac; --warn: #fbbf24; --danger: #fca5a5;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--page); color: var(--ink); font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 32px); }
  h1 { font-size: 26px; margin: 0; text-wrap: balance; }
  h2 { font-size: 15px; font-weight: 600; color: var(--body); margin: 26px 0 10px; }
  p { margin: 0 0 12px; color: var(--body); }
  .sub { margin: 4px 0 18px; }
  .q { background: var(--card); border: 1px solid var(--edge); border-radius: 14px; padding: 14px; margin-bottom: 10px; }
  .q.late { background: var(--card-late); border-color: var(--edge-late); }
  .q .meta { font-size: 14px; color: var(--body); margin-bottom: 6px; }
  .q .text { color: var(--ink); }
  .q .state { font-size: 14px; margin-top: 8px; color: var(--body); }
  .q.late .state { color: var(--warn); font-weight: 600; }
  .q.done .text { color: var(--body); }
  .q.done .state { color: var(--ok); }
  button, .btn { display: block; width: 100%; min-height: 48px; padding: 12px 14px; border: 0; border-radius: 12px; background: var(--primary); color: var(--primary-on); font: 600 17px/1.3 inherit; font-family: inherit; text-align: center; text-decoration: none; cursor: pointer; }
  button.quiet, .btn.quiet { background: transparent; color: var(--ink); border: 1px solid var(--edge); }
  .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .tabs button { flex: 1; min-height: 42px; font-size: 15px; padding: 8px; }
  .tabs button:not(.on) { background: transparent; color: var(--ink); border: 1px solid var(--edge); }
  input { width: 100%; min-height: 52px; padding: 12px; margin: 0 0 12px; border-radius: 12px; border: 1px solid var(--edge); background: var(--card); color: var(--ink); font: 600 20px/1.2 ui-monospace, Menlo, monospace; letter-spacing: 2px; text-transform: uppercase; text-align: center; }
  input:focus-visible, button:focus-visible, .btn:focus-visible { outline: 2px solid var(--ok); outline-offset: 2px; }
  .err { color: var(--danger); min-height: 22px; font-size: 15px; }
  .code { font: 600 22px/1.2 ui-monospace, Menlo, monospace; letter-spacing: 2px; color: var(--ink); background: var(--card); border: 1px solid var(--edge); border-radius: 12px; padding: 14px; text-align: center; margin: 0 0 16px; }
  ol { color: var(--body); padding-left: 22px; margin: 0 0 16px; }
  li { margin-bottom: 8px; }
  .empty { padding: 30px 14px; text-align: center; color: var(--body); }
  .note { background: var(--card); border: 1px solid var(--edge); border-radius: 12px; padding: 12px 14px; font-size: 15px; color: var(--body); margin-bottom: 14px; }
  .gap { margin-top: 10px; }
  /* his replies (W129): how a kind of question should be put to the men */
  .replies { margin-top: 10px; border-top: 1px solid var(--edge); padding-top: 10px; }
  .reply { font-size: 15px; color: var(--ink); margin-bottom: 8px; }
  .reply .by { color: var(--body); font-size: 13px; display: block; }
  .reply .ans { color: var(--ok); font-size: 14px; margin-top: 3px; }
  .reply .wait { color: var(--warn); font-size: 13px; margin-top: 3px; }
  textarea { width: 100%; min-height: 96px; padding: 12px; margin: 8px 0; border-radius: 12px; border: 1px solid var(--edge); background: var(--page); color: var(--ink); font: 16px/1.4 inherit; font-family: inherit; resize: vertical; }
  textarea:focus-visible { outline: 2px solid var(--ok); outline-offset: 2px; }
  .row { display: flex; gap: 8px; }
  .row button { min-height: 44px; font-size: 15px; }
  .q button.small { min-height: 40px; font-size: 15px; margin-top: 10px; padding: 8px 12px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  /* THE MANAGEMENT TAB (W141): Known and Unknown, a section a machine; every tap goes to the bot and comes back checked */
  .top { display: flex; gap: 8px; margin: 14px 0 6px; }
  .top button { flex: 1; min-height: 44px; font-size: 16px; padding: 8px; }
  .top button:not(.on) { background: transparent; color: var(--ink); border: 1px solid var(--edge); }
  .days { display: flex; align-items: center; gap: 8px; margin: 10px 0 12px; }
  .days button { width: 48px; min-height: 44px; padding: 0; background: transparent; color: var(--ink); border: 1px solid var(--edge); font-size: 20px; }
  .days button:disabled { opacity: .35; }
  .days .d { flex: 1; text-align: center; font-weight: 600; }
  .mach { margin: 22px 0 8px; display: flex; align-items: baseline; gap: 10px; }
  .mach .mc { font: 700 15px/1 ui-monospace, Menlo, monospace; color: #05080d; background: var(--mcol, #94a3b8); border-radius: 7px; padding: 5px 8px; }
  .mach .where { color: var(--body); font-size: 15px; }
  .t { background: var(--card); border: 1px solid var(--edge); border-radius: 14px; padding: 14px; margin-bottom: 10px; }
  .t.solved { opacity: .72; }
  .t .meta { font-size: 13px; color: var(--body); margin-bottom: 4px; }
  .t .what { color: var(--ink); }
  .t .more { color: var(--body); font-size: 15px; white-space: pre-line; margin-top: 6px; }
  .t .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .t .acts button { width: auto; flex: 1 1 auto; min-height: 44px; font-size: 15px; padding: 9px 12px; }
  .t .acts button.alt { background: transparent; color: var(--ink); border: 1px solid var(--edge); }
  .t .acts button.usual { outline: 2px solid var(--ok); outline-offset: 1px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chips button { width: auto; min-height: 36px; font-size: 14px; padding: 6px 10px; background: transparent; color: var(--ok); border: 1px solid rgba(134, 239, 172, .45); border-radius: 999px; }
  .dec { font-size: 14px; margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--edge); color: var(--body); }
  .dec b { color: var(--ink); font-weight: 600; }
  .dec .st { display: inline-block; font-weight: 700; margin-right: 6px; }
  .dec .filed { color: var(--ok); } .dec .for_code { color: var(--warn); } .dec .failed { color: var(--danger); } .dec .sent { color: var(--body); }
  .dec .bot { display: block; color: var(--body); white-space: pre-line; margin-top: 3px; }
  .dec button { width: auto; min-height: 34px; font-size: 13px; padding: 4px 10px; margin-top: 6px; background: transparent; color: var(--ink); border: 1px solid var(--edge); }
  .state2 { font-size: 14px; margin-top: 8px; color: var(--ok); }
  .state2.wait { color: var(--warn); }
  .msgs { background: var(--card); border: 1px solid var(--edge); border-radius: 14px; padding: 6px 14px; margin-bottom: 10px; }
  .msg { display: grid; grid-template-columns: 48px 1fr; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--edge); font-size: 15px; }
  .msg:last-child { border-bottom: 0; }
  .msg .tm { color: var(--body); font-variant-numeric: tabular-nums; }
  .msg .pl { color: var(--body); font-size: 13px; }
  .msg .pl.off { color: var(--warn); font-weight: 600; }
  .filedto { font-size: 15px; color: var(--body); margin: 0 0 8px; }
  .filedto b { color: var(--ink); }
  .filedto .off { color: var(--warn); font-weight: 600; }
  details.say { margin-top: 10px; }
  details.say summary { cursor: pointer; color: var(--ink); font-size: 15px; min-height: 36px; display: flex; align-items: center; }
  .donehead { color: var(--body); font-size: 14px; margin: 16px 0 8px; }
  .toast { position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 16px); max-width: 528px; margin: 0 auto; background: #1d2738; border: 1px solid var(--edge); color: var(--ink); border-radius: 12px; padding: 12px 14px; font-size: 15px; z-index: 10; white-space: pre-line; }
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script>
const FN = 'https://fepsvkuutodaihotucuh.supabase.co/functions/v1/staff-app'
const VAPID = 'BP2UhZjRq3DyhhjuaqQ9QW9Di2G2Gs7xT-MkG0IYWqWBy0HSXNQ4L3y0P7h2a3aCOub68ILfEFmAQ873QPGNY2k'
const $ = document.getElementById('app')
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
const store = { get: k => { try { return localStorage.getItem(k) } catch { return null } }, set: (k, v) => { try { localStorage.setItem(k, v) } catch {} }, del: k => { try { localStorage.removeItem(k) } catch {} } }
const params = new URLSearchParams(location.search)
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true
const iphone = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)
const demo = params.get('demo')
let tab = 'open', data = null

const DEMO = { // invented, for looking at the page with ?demo=man or ?demo=owner; it never reaches the server
  man: { role: 'man', name: 'Test Operator', questions: [
    { id: 1, machine_code: 'A1', day_date: '2026-01-05', question: 'Your ending register has no COUNT. Send the COUNT of everything on the machine now, under the heading COUNT.', created_at: new Date(Date.now() - 2.4e6).toISOString(), opened_at: null, closed_at: null },
    { id: 2, machine_code: 'A1', day_date: '2026-01-04', question: 'Please send that truck line again with the right times.', created_at: new Date(Date.now() - 9e7).toISOString(), closed_at: new Date(Date.now() - 8.9e7).toISOString(), closed_how: 'corrected' }] },
  owner: { role: 'owner', name: '', settings: { send_to_men: false, ask_after_min: 45, notify_after_min: 180 }, questions: [
    { id: 1, who: 'Test Operator', machine_code: 'A1', day_date: '2026-01-05', question: 'Your ending register has no COUNT. Send the COUNT of everything on the machine now, under the heading COUNT.', created_at: new Date(Date.now() - 1.2e7).toISOString(), closed_at: null, opened_at: null,
      notes: [{ id: 1, here: true, note: 'Tell them which register: the ending register of today.', status: 'applied', reply: 'Changed: the question now names the ending register and the day.', created_at: new Date(Date.now() - 6e6).toISOString() }] },
    { id: 2, who: 'Second Operator', machine_code: 'A2', day_date: '2026-01-05', question: 'Please check the running total.', created_at: new Date(Date.now() - 9e5).toISOString(), closed_at: null, opened_at: new Date().toISOString() },
    { id: 3, who: 'Second Operator', machine_code: 'A2', day_date: '2026-01-04', question: 'Please send that truck line again with the right times.', created_at: new Date(Date.now() - 9e7).toISOString(), closed_at: new Date(Date.now() - 8.9e7).toISOString(), closed_how: 'corrected' }] },
}

async function api(task, body) {
  const r = await fetch(`${FN}?task=${task}`, { method: body ? 'POST' : 'GET', headers: { 'content-type': 'application/json', 'x-device-token': store.get('token') || '' }, body: body ? JSON.stringify(body) : undefined })
  const j = await r.json().catch(() => ({}))
  if (!r.ok) { const e = new Error(j.error || 'Please check your connection and try again.'); e.status = r.status; throw e }
  return j
}
const day = d => d ? new Date(d + 'T12:00:00').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }) : ''
const when = iso => new Date(iso).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })
const age = iso => { const m = Math.round((Date.now() - new Date(iso)) / 60000); return m < 60 ? `${m} min` : m < 2880 ? `${Math.round(m / 60)} h` : `${Math.round(m / 1440)} days` }

function showSignin(msg = '') {
  const code = params.get('code') || store.get('code') || ''
  // on an iPhone a page in Safari and the same page on the home screen keep separate sign-ins, and only the home screen can notify
  if (iphone && !standalone && !demo) {
    if (code) store.set('code', code)
    $.innerHTML = `<h1>Questions</h1><p class="sub">Add this to your home screen first.</p>
      <ol><li>Tap the Share button in Safari.</li><li>Tap <b>Add to Home Screen</b>, then <b>Add</b>.</li><li>Open <b>Questions</b> from your home screen and type this code:</li></ol>
      <div class="code">${esc(code || 'The code in your message')}</div>`
    return
  }
  $.innerHTML = `<h1>Questions</h1><p class="sub">Type the code from your message.</p>
    <form id="f"><label for="c" class="sr">Your code</label><input id="c" value="${esc(code)}" autocomplete="off" autocapitalize="characters" spellcheck="false"><div class="err" role="alert">${esc(msg)}</div><button>Sign in</button></form>`
  document.getElementById('f').onsubmit = async e => {
    e.preventDefault()
    try {
      const j = await api('signin', { code: document.getElementById('c').value })
      store.set('token', j.token); store.del('code'); history.replaceState(null, '', location.pathname); load()
    } catch (x) { showSignin(x.message) }
  }
  if (code && params.get('code') && !store.get('tried')) { store.set('tried', '1'); document.getElementById('f').requestSubmit() }
}

function pushState() {
  if (demo || !('serviceWorker' in navigator) || !('PushManager' in window)) return 'none'
  return Notification.permission
}
async function turnOnPush() {
  const reg = await navigator.serviceWorker.register('sw.js')
  const perm = await Notification.requestPermission()
  if (perm !== 'granted') { render(); return }
  await navigator.serviceWorker.ready
  const key = Uint8Array.from(atob(VAPID.replace(/-/g, '+').replace(/_/g, '/').padEnd(Math.ceil(VAPID.length / 4) * 4, '=')), c => c.charCodeAt(0))
  const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: key })
  await api('subscribe', { subscription: sub.toJSON() })
  store.set('pushed', '1'); render()
}

let replying = null, drafts = {}   // the question he is writing a reply on; what he has typed, kept when the page refreshes
function replies(q) {
  const ns = q.notes || []
  const list = ns.map(n => `<div class="reply"><span class="by">You${n.here ? '' : ', on another question of this kind'} · ${esc(day(String(n.created_at).slice(0, 10)))}</span>${esc(n.note)}
    ${n.reply ? `<div class="ans">${esc(n.reply)}</div>` : '<div class="wait">Waiting for Code to change how this is put</div>'}</div>`).join('')
  const box = replying === q.id
    ? `<label for="r${q.id}" class="sr">Your reply</label><textarea id="r${q.id}" placeholder="How should this be put to the men?">${esc(drafts[q.id] || '')}</textarea><div class="err" role="alert" id="e${q.id}"></div>
       <div class="row"><button data-send="${q.id}">Send reply</button><button class="quiet" data-cancel="${q.id}">Cancel</button></div>`
    : `<button class="quiet small" data-reply="${q.id}">Reply</button>`
  return `${list ? `<div class="replies">${list}</div>` : ''}${box}`
}

function card(q, owner, notifyAfter) {
  const closed = !!q.closed_at
  const late = !closed && owner && (Date.now() - new Date(q.created_at)) > notifyAfter * 60000
  const state = closed
    ? (q.closed_how === 'corrected' ? `✓ Corrected at ${when(q.closed_at)}` : `✓ Closed at ${when(q.closed_at)}`)
    : owner ? `Not corrected · ${age(q.created_at)}${q.opened_at ? ` · opened ${when(q.opened_at)}` : ' · not opened'}`
    : 'Send your correction in your machine\'s WhatsApp group.'
  return `<article class="q${closed ? ' done' : ''}${late ? ' late' : ''}" data-id="${q.id}">
    <div class="meta">${owner ? `${esc(q.who || 'Sender not known')} · ` : ''}${esc(q.machine_code || '')} · ${esc(day(q.day_date))}</div>
    <div class="text">${esc(q.question)}</div><div class="state">${esc(state)}</div>${owner ? replies(q) : ''}</article>`
}

function render() {
  const owner = data.role === 'owner'
  const qs = data.questions, open = qs.filter(q => !q.closed_at), done = qs.filter(q => q.closed_at)
  const after = data.settings?.notify_after_min ?? 180
  const ps = pushState()
  const ask = (ps === 'default' || (ps === 'granted' && !store.get('pushed'))) ? `<button id="push" class="gap">Turn on notifications</button>` : ps === 'denied' ? `<div class="note">Notifications are off for this app. Turn them on in your phone's settings.</div>` : ''
  if (owner) {
    const late = open.filter(q => (Date.now() - new Date(q.created_at)) > after * 60000)
    const show = tab === 'open' ? [...open].sort((a, b) => new Date(a.created_at) - new Date(b.created_at)) : qs
    const top = `<div class="top" role="tablist"><button role="tab" aria-selected="${view === 'manage'}" data-view="manage" class="${view === 'manage' ? 'on' : ''}">Management${mdata ? ` · ${unknownOpen()}` : ''}</button><button role="tab" aria-selected="${view === 'men'}" data-view="men" class="${view === 'men' ? 'on' : ''}">Men's questions · ${open.length}</button></div>`
    if (view === 'manage') {
      $.innerHTML = `<h1>Questions</h1>${top}${ask}${manageHtml()}`
      $.querySelectorAll('[data-view]').forEach(b => b.onclick = () => setView(b.dataset.view))
      document.getElementById('push')?.addEventListener('click', () => turnOnPush().catch(e => alert(e.message)))
      return
    }
    $.innerHTML = `<h1>Questions</h1>${top}<p class="sub">${open.length} not corrected${late.length ? `, ${late.length} past ${after} min` : ''}</p>
      ${data.settings?.send_to_men ? '' : '<div class="note">Trial run: the men are not being sent these yet.</div>'}${ask}
      <div class="tabs gap"><button data-t="open" class="${tab === 'open' ? 'on' : ''}">Not corrected</button><button data-t="all" class="${tab === 'all' ? 'on' : ''}">Everything</button></div>
      ${show.map(q => card(q, true, after)).join('') || '<div class="empty">Nothing here.</div>'}`
    $.querySelectorAll('[data-view]').forEach(b => b.onclick = () => setView(b.dataset.view))
    $.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { tab = b.dataset.t; render() })
    $.querySelectorAll('[data-reply]').forEach(b => b.onclick = () => { replying = Number(b.dataset.reply); render(); document.getElementById(`r${replying}`)?.focus() })
    $.querySelectorAll('textarea[id^="r"]').forEach(t => t.oninput = () => { drafts[t.id.slice(1)] = t.value })
    $.querySelectorAll('[data-cancel]').forEach(b => b.onclick = () => { replying = null; render() })
    $.querySelectorAll('[data-send]').forEach(b => b.onclick = async () => {
      const id = Number(b.dataset.send), text = document.getElementById(`r${id}`).value.trim(), err = document.getElementById(`e${id}`)
      if (!text) { err.textContent = 'Write your reply first.'; return }
      b.disabled = true
      try {
        const j = demo ? { note: { id: Date.now(), note: text, status: 'open', reply: null, created_at: new Date().toISOString() } } : await api('reply', { id, text })
        const q = data.questions.find(x => x.id === id)
        for (const x of data.questions) if (x === q || (q.code && x.code === q.code)) x.notes = [...(x.notes || []), { ...j.note, here: x === q }]
        replying = null; delete drafts[id]; render()
      } catch (x) { err.textContent = x.message; b.disabled = false }
    })
  } else {
    $.innerHTML = `<h1>${open.length ? `${open.length} question${open.length === 1 ? '' : 's'} for you` : 'No questions'}</h1>
      <p class="sub">${esc(data.name)}</p>${ask}
      ${open.map(q => card(q, false)).join('') || '<div class="empty">Nothing needs correcting.</div>'}
      ${open.length ? '<a class="btn gap" href="whatsapp://">Open WhatsApp</a>' : ''}
      ${done.length ? `<h2>Done</h2>${done.slice(0, 10).map(q => card(q, false)).join('')}` : ''}`
    if (!demo) open.filter(q => !q.opened_at).forEach(q => { q.opened_at = new Date().toISOString(); api('opened', { id: q.id }).catch(() => {}) })
  }
  document.getElementById('push')?.addEventListener('click', () => turnOnPush().catch(e => alert(e.message)))
}

// ── THE MANAGEMENT TAB (W141; the owner, 5 Nov 2026: "Known and Unknown and a section for each machine … all my decisions should be recorded
// too … don't forget to ensure the plumbing behind the scenes is sound"). This page files nothing: every tap and every word goes to the
// staff-app function, which hands it to the bot's own answer path and reports back what it found after — Filed, Kept for Code, or Not filed.
let view = ['manage', 'men'].includes(params.get('view')) ? params.get('view') : (store.get('view') || 'manage')
let mside = 'unknown', mday = null, mdata = null, mbusy = false, mdrafts = {}
const MC = { A: '#60a5fa', A2: '#4ade80', A3: '#fb923c', A4: '#c084fc', A5: '#f472b6', S: '#facc15', TRK: '#2dd4bf' }
const STATE = { filed: '✓ Filed', for_code: '⏳ Kept for Code', failed: '⚠ Not filed', sent: '… Sending' }
const fold = s => String(s || '').toLowerCase().replace(/[^a-z0-9]/g, '')
const samePlace = (a, b) => { const x = fold(a), y = fold(b); return !!x && !!y && (x.includes(y) || y.includes(x)) }
const shiftDay = (d, n) => { const x = new Date(d + 'T12:00:00Z'); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10) }
function setView(v) { view = v; store.set('view', v); render(); if (v === 'manage') loadManage() }
const allThings = () => mdata ? [...mdata.machines.flatMap(m => [...m.unknown, ...m.known]), ...mdata.other] : []
const unknownOpen = () => allThings().filter(t => t.side === 'unknown' && !t.solved).length
function toast(text) {
  document.querySelector('.toast')?.remove()
  const el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); el.textContent = text
  document.body.appendChild(el); setTimeout(() => el.remove(), 6000)
}

function decHtml(d) {
  const what = d.how === 'words' ? `“${esc(d.his_text)}”` : `<b>${esc(d.label || d.answer || '')}</b>`
  const undo = d.how === 'tap' && d.state === 'filed' && !d.undone_by ? `<button data-undo="${d.id}">Undo</button>` : ''
  return `<div class="dec"><span class="st ${esc(d.state)}">${esc(STATE[d.state] || d.state)}</span>You ${d.how === 'undo' ? '' : 'said '}${what} · ${esc(when(d.created_at))}${d.undone_by ? ' · undone' : ''}
    ${d.bot_reply ? `<span class="bot">Bot: ${esc(d.bot_reply)}</span>` : ''}${d.state !== 'filed' && d.checked ? `<span class="bot">${esc(d.checked)}</span>` : ''}${d.code_reply ? `<span class="bot">Code: ${esc(d.code_reply)}</span>` : ''}${undo}</div>`
}
function sayBox(key, label, open) {
  return `<details class="say"${open || mdrafts[key] ? ' open' : ''}><summary>${esc(label)}</summary><label for="w-${esc(key)}" class="sr">${esc(label)}</label>
    <textarea id="w-${esc(key)}" data-wkey="${esc(key)}" placeholder="Say it as you would to the bot">${esc(mdrafts[key] || '')}</textarea>
    <button data-say="${esc(key)}">Send to the bot</button></details>`
}
function thingHtml(t) {
  const usual = (mdata.usual || {})[t.code] || []
  const usualTap = new Set(usual.filter(u => u.how === 'tap').map(u => u.said))
  const acts = !t.solved && t.buttons ? `<div class="acts">${t.buttons.map((b, bi) => `<button data-tap="${esc(t.key)}" data-b="${bi}" class="${b.answer === 'known' ? 'alt' : ''}${usualTap.has(b.answer) ? ' usual' : ''}">${esc(b.label)}</button>`).join('')}</div>` : ''
  const chips = !t.solved ? usual.filter(u => u.how === 'words').map(u => `<button data-usual="${esc(t.key)}" data-text="${esc(u.shown_as)}">${esc(u.shown_as)} · ${u.n}×</button>`).join('') : ''
  const state = t.solved ? `<div class="state2">✓ ${esc(t.answer ? t.answer.text || 'Answered' : 'Settled')}</div>` : t.asked ? `<div class="state2 wait">Asked — waiting for him</div>` : ''
  return `<article class="t${t.solved ? ' solved' : ''}">
    <div class="meta">${esc(t.head || '')}${t.day && mdata && t.day !== mdata.day ? ` · ${esc(day(t.day))}` : ''}</div>
    <div class="what">${esc(t.what)}</div>${t.more ? `<div class="more">${esc(t.more)}</div>` : ''}${state}${acts}
    ${chips ? `<div class="chips" aria-label="Your usual answers">${chips}</div>` : ''}
    ${t.solved ? '' : sayBox(t.key, t.buttons ? 'Or say it in words' : 'Answer in words', !t.buttons)}
    ${(t.decisions || []).map(decHtml).join('')}</article>`
}
function machHead(m) {
  const b = m.board
  return `<h2 class="mach" style="--mcol:${MC[m.code] || '#94a3b8'}"><span class="mc">${esc(m.code)}</span><span class="where">${b && (b.said || b.site) ? esc((b.said || b.site) + (b.area ? ', ' + b.area : '')) : (m.job ? esc(m.job.site) : 'no register yet')}</span></h2>`
}
function unknownHtml() {
  let h = ''
  const groups = [...mdata.machines.map(m => ({ m, ts: m.unknown })), { m: null, ts: mdata.other.filter(t => t.side === 'unknown') }]
  for (const { m, ts } of groups) {
    if (!ts.length) continue
    const open = ts.filter(t => !t.solved), done = ts.filter(t => t.solved)
    h += m ? machHead(m) : '<h2 class="mach"><span class="mc">—</span><span class="where">Not tied to a machine</span></h2>'
    h += open.map(thingHtml).join('') || '<p>Nothing waiting.</p>'
    if (done.length) h += `<div class="donehead">Done · ${done.length}</div>${done.map(thingHtml).join('')}`
  }
  return h || '<div class="empty">Nothing needs your direction for this day.</div>'
}
function knownHtml() {
  let h = ''
  for (const m of mdata.machines) {
    const b = m.board
    if (!b && !m.messages.length && !m.known.length && !m.words.length) continue
    // the register's own PROJECT line (board.said); the board's site is the plan's once a job is planned
    const reg = b && (b.said || (!m.job && b.site)), plan = m.job && m.job.site, off = reg && plan && !samePlace(reg, plan)
    h += machHead(m)
    h += `<p class="filedto">${m.job ? `Filed to <b>#${esc(m.job.number || '?')} ${esc(m.job.site)}</b>` : '<span class="off">No planned job this day</span>'}${reg ? ` · register: <b class="${off ? 'off' : ''}">${esc(reg)}</b>` : ''}</p>`
    if (b) h += `<p class="filedto">${esc(b.who || '')}${b.trucks != null ? ` · ${b.trucks} truck${b.trucks === 1 ? '' : 's'}` : ''}${b.m3 ? ` · ${b.m3} m³` : ''}${b.engine && b.engine.start != null ? ` · engine ${b.engine.start}${b.engine.end != null ? ' → ' + b.engine.end : ''}` : ''}${b.sr ? ' · SR ✓' : ''}${b.er ? ' · ER ✓' : ''}</p>`
    if (m.messages.length) h += `<div class="msgs">${m.messages.map(x => `<div class="msg"><span class="tm">${esc(x.time || '')}</span><span>${esc(x.what)}${x.who ? ` · ${esc(x.who)}` : ''}${x.place ? `<span class="pl${reg && !samePlace(x.place, reg) ? ' off' : ''}"> — filed at ${esc(x.place)}</span>` : ''}</span></div>`).join('')}</div>`
    h += m.known.filter(t => !t.solved).map(thingHtml).join('')
    const settled = m.known.filter(t => t.solved)
    if (settled.length) h += `<div class="donehead">Settled · ${settled.length}</div>${settled.map(thingHtml).join('')}`
    h += `<article class="t">${sayBox('m:' + m.code, 'Something filed wrong? Tell the bot', false)}${m.words.map(decHtml).join('')}</article>`
  }
  const other = mdata.other.filter(t => t.side === 'known')
  if (other.length) h += `<h2 class="mach"><span class="mc">—</span><span class="where">Not tied to a machine</span></h2>${other.map(thingHtml).join('')}`
  return h || '<div class="empty">Nothing filed for this day yet.</div>'
}
function manageHtml() {
  if (!mdata) return '<div class="empty">Loading…</div>'
  const n = unknownOpen()
  return `<div class="days"><button data-day="-1" aria-label="Day before">‹</button><span class="d">${esc(day(mdata.day))}${mdata.day === mdata.today ? ' · today' : ''}</span><button data-day="1" aria-label="Day after" ${mdata.day >= mdata.today ? 'disabled' : ''}>›</button></div>
    <div class="tabs"><button data-side="unknown" class="${mside === 'unknown' ? 'on' : ''}">Unknown${n ? ` · ${n}` : ''}</button><button data-side="known" class="${mside === 'known' ? 'on' : ''}">Known</button></div>
    ${mdata.for_code ? `<div class="note">${mdata.for_code} of your answers wait for Code: the bot could not file them from your words.</div>` : ''}
    ${mside === 'unknown' ? unknownHtml() : knownHtml()}`
}
const findThing = key => allThings().find(t => t.key === key)
async function decide(body, btn) {
  if (mbusy) return
  mbusy = true; if (btn) btn.disabled = true
  try {
    const j = demo ? { state: 'filed', reply: '(demo) ' + JSON.stringify(body), checked: 'demo' } : await api('decide', body)
    toast(`${STATE[j.state] || j.state}${j.reply ? `\nBot: ${j.reply}` : ''}${j.state !== 'filed' && j.checked ? `\n${j.checked}` : ''}`)
    return j
  } catch (e) { toast(`⚠ ${e.message}`); if (btn) btn.disabled = false; return null }
  finally { mbusy = false; await loadManage() }
}
$.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b || view !== 'manage') return
  if (b.dataset.side) { mside = b.dataset.side; render(); return }
  if (b.dataset.day) { const d = shiftDay(mdata.day, Number(b.dataset.day)); mday = d >= mdata.today ? null : d; mdata = { ...mdata, day: d, machines: [], other: [] }; render(); loadManage(); return }
  if (b.dataset.tap) {
    const t = findThing(b.dataset.tap), bt = t && t.buttons && t.buttons[Number(b.dataset.b)]; if (!bt) return
    // "Ask him": the draft goes to his WhatsApp first, as in the bot app; then the answer is filed
    if (bt.share) { if (navigator.share) { try { await navigator.share({ text: bt.share }) } catch { return } } else { try { await navigator.clipboard.writeText(bt.share); toast('Copied — paste it to him') } catch {} } }
    return decide({ outbox_id: t.outbox_id, item: t.item, b: Number(b.dataset.b), side: t.side }, b)
  }
  if (b.dataset.usual) { const t = findThing(b.dataset.usual); if (t) return decide({ text: b.dataset.text, machine: t.machine, day: t.day || mdata.day, side: t.side, outbox_id: t.outbox_id ?? null, item: t.item ?? null, code: t.code, shown: t.what }, b) }
  if (b.dataset.say) {
    const key = b.dataset.say, text = (document.getElementById('w-' + key)?.value || '').trim()
    if (!text) { toast('Write it first.'); return }
    let body
    if (key.startsWith('m:')) body = { text, machine: key.slice(2), day: mdata.day, side: 'known' }
    else { const t = findThing(key); if (!t) return; body = { text, machine: t.machine, day: t.day || mdata.day, side: t.side, outbox_id: t.outbox_id ?? null, item: t.outbox_id != null ? t.item : null, code: t.code, shown: t.what } }
    const j = await decide(body, b); if (j) delete mdrafts[key]; return
  }
  if (b.dataset.undo) return decide({ undo: Number(b.dataset.undo) }, b)
})
$.addEventListener('input', e => { const k = e.target.dataset && e.target.dataset.wkey; if (k) mdrafts[k] = e.target.value })
async function loadManage() {
  if (demo) { mdata = mdata || DEMO_M; render(); return }
  try { mdata = await api(`manage${mday ? `&day=${mday}` : ''}`); if (view === 'manage' && data) render() }
  catch (e) { if (view === 'manage' && data) { if (!mdata) mdata = { day: mday || '', today: '', machines: [], other: [], usual: {} }; render(); toast(`⚠ ${e.message}`) } }
}
const DEMO_M = { day: '2026-01-05', today: '2026-01-05', for_code: 1, usual: { NO_PLANNED_JOB: [{ code: 'NO_PLANNED_JOB', how: 'tap', said: 'job', shown_as: 'Another day of #9001 Test Site', n: 4 }] },   // invented, ?demo=owner only
  machines: [
    { code: 'A1', board: { who: 'Test Operator', site: 'Test Site', said: 'Second Site', area: 'Testarea', trucks: 3, m3: 24, sr: true, er: false, engine: { start: 100.5, end: null } }, job: { number: '9001', site: 'Test Site', status: 'started' },
      messages: [{ time: '06:02', what: 'starting register', who: 'Test Operator', place: 'Testarea - Test Site' }, { time: '09:40', what: 'trucks', who: 'Test Operator', place: 'Testarea - Test Site' }],
      unknown: [{ key: '4:0', outbox_id: 4, item: 0, code: 'REGISTER_NOT_PLAN', side: 'unknown', machine: 'A1', day: '2026-01-05', solved: false, buttons: [{ label: 'The plan is right — stop reminding', answer: 'known' }], head: 'A1 · Test Operator · 06:02', what: 'A1 is planned on #9001 Test Site for Mon, 5 Jan, but its starting register says PROJECT: Second Site. The day is filed to your plan — if the machine moved, tell the bot where it is.', decisions: [] },
        { key: '1:0', outbox_id: 1, item: 0, code: 'STAFF_UNMATCHED', side: 'unknown', machine: 'A1', day: '2026-01-05', solved: false, head: 'A1 · Test Operator · 07:07', what: 'Somebody New — not on the staff list', buttons: [{ label: 'Ask him', answer: 'asked', share: 'Who is he?' }, { label: "He's right — fix the file", answer: 'file_wrong' }, { label: 'Known — stop reminding', answer: 'known' }],
          decisions: [{ id: 2, how: 'words', his_text: 'he is a new pipe fixer', state: 'for_code', bot_reply: "✓ Got it — not a cost or a machine assignment, so I've only kept it", checked: 'kept for Code', created_at: new Date().toISOString() }] }],
      known: [{ key: '2:0', outbox_id: 2, item: 0, code: 'VOLUME_DISCREPANCY', side: 'known', machine: 'A1', day: '2026-01-05', solved: false, asked: true, head: 'A1 · Test Operator · 10:15', what: 'Truck 3: 8 m³, but the running total moved by 9', buttons: [{ label: 'Ask him', answer: 'asked' }, { label: 'Known — stop reminding', answer: 'known' }], decisions: [] }], words: [] },
    { code: 'A2', board: null, job: null, messages: [], known: [], words: [],
      unknown: [{ key: '3:0', outbox_id: 3, item: 0, code: 'NO_PLANNED_JOB', side: 'unknown', machine: 'A2', day: '2026-01-05', solved: true, answer: { text: 'You: another day of #9001' }, head: 'A2 · 05:30', what: 'A2 sent its starting register and has no planned job — which job is it?', buttons: [], decisions: [{ id: 1, how: 'tap', label: 'Another day of #9001 Test Site', answer: 'job', state: 'filed', bot_reply: '✓ Filed on #9001', checked: 'on the item', created_at: new Date().toISOString() }] }] }],
  other: [] }

async function load() {
  if (demo) { data = DEMO[demo] || DEMO.man; if (data.role === 'owner' && view === 'manage') { mdata = DEMO_M } render(); return }
  if (!store.get('token')) return showSignin()
  try { data = await api('mine'); render(); if (data.role === 'owner' && view === 'manage') loadManage() }
  catch (e) {
    if (e.status === 401) { store.del('token'); showSignin() }
    else if (data) render()
    else $.innerHTML = `<h1>Questions</h1><p class="sub">${esc(e.message)}</p><button id="r">Try again</button>`, document.getElementById('r').onclick = load
  }
}
if ('serviceWorker' in navigator && !demo) { navigator.serviceWorker.register('sw.js').catch(() => {}); navigator.serviceWorker.addEventListener('message', e => { if (e.data && e.data.view) { view = e.data.view; store.set('view', view) } load() }) }
document.addEventListener('visibilitychange', () => { if (!document.hidden) load() })
load()
</script>
