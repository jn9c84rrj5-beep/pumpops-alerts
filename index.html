<!doctype html>
<html lang="en">
<head>

<style>
  /* THE BOT'S PAGE (W18, 1 Oct 2026): departments along the bottom, needs-you / solved / everything, liquid glass. No data lives here. */
  /* DARK ALWAYS (the owner, 1 Oct 2026: "dark mode always!!") — there is no light theme, whatever the phone is set to. */
  :root {
    color-scheme: dark;
    --bg-a: #06131c; --bg-b: #0b1f1a; --bg-c: #101327; --page: #05080d;
    --ink: #f4f7fb; --strong: #d6dde8; --body: #a3afc2;
    --glass: rgba(22, 30, 44, .58); --glass-strong: rgba(18, 25, 38, .78); --card: rgba(20, 28, 42, .72); --solid: #121a27;
    --edge: rgba(255, 255, 255, .13); --edge-top: rgba(255, 255, 255, .30); --shadow: 0 10px 34px rgba(0, 0, 0, .42);
    --primary: #22c55e; --primary-ink: #86efac; --primary-on: #04210f;
    --warn: #fbbf24; --warn-bg: rgba(251, 191, 36, .16); --danger: #fca5a5; --info: #93c5fd; --info-bg: rgba(96, 165, 250, .16);
    --ok-bg: rgba(34, 197, 94, .16); --track: rgba(255, 255, 255, .10); --badge: #fbbf24; --badge-on: #1c1203;
    --z-bar: 20; --z-sheet: 40; --z-toast: 50;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* THE SHELL NEVER SCROLLS (the owner, 2 Oct 2026: "the bottom nav bar in the bot app doesnt always stay fixed to the bottom, please make
     it so"): on the iPhone a fixed bar rides with the page when it bounces at its ends, is dragged sideways, or the keyboard opens and
     closes. So the page itself is pinned to the screen and only #scroll moves inside it; the bar and the button sit outside what moves. */
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    position: fixed; inset: 0; width: 100%; color: var(--strong); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    background:
      radial-gradient(120% 60% at 12% 0%, var(--bg-b) 0%, transparent 62%),
      radial-gradient(90% 55% at 100% 18%, var(--bg-c) 0%, transparent 60%),
      radial-gradient(110% 70% at 50% 100%, var(--bg-a) 0%, transparent 70%), var(--page);
  }
  #scroll { position: absolute; inset: 0; overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) calc(env(safe-area-inset-bottom) + 112px) env(safe-area-inset-left); }
  button, input, textarea { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  .glass { background: var(--glass); -webkit-backdrop-filter: blur(26px) saturate(180%); backdrop-filter: blur(26px) saturate(180%); border: 1px solid var(--edge); box-shadow: inset 0 1px 0 var(--edge-top), var(--shadow); }

  /* the gate (add to home screen · turn on notifications · waiting for approval) */
  .gate { margin: 16vh auto 0; max-width: 420px; padding: 0 20px; }
  .gate h2 { color: var(--ink); font-size: 22px; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 10px; text-wrap: balance; }
  .gate p, .gate li { color: var(--body); }
  .gate ol { padding-left: 20px; display: grid; gap: 6px; }
  .big { font-weight: 600; font-size: 16px; width: 100%; min-height: 52px; border-radius: 14px; border: 0; background: var(--primary); color: var(--primary-on); margin-top: 18px; }
  .big:disabled { opacity: .5; }

  /* header */
  header { position: sticky; top: env(safe-area-inset-top); z-index: var(--z-bar); padding: 10px 16px 10px; max-width: 672px; margin: 0 auto; }
  /* what scrolls under the status bar and the strip above the glass fades into the page */
  header::before { content: ""; position: absolute; left: 0; right: 0; top: calc(-1 * env(safe-area-inset-top)); height: calc(env(safe-area-inset-top) + 26px); background: linear-gradient(var(--page) 55%, transparent); z-index: -1; pointer-events: none; }
  /* scrolled: the brief folds away, the title and the filter stay */
  .scrolled .brief { display: none; }
  .scrolled .head { padding: 10px 14px 10px; }
  .scrolled h1 { font-size: 19px; }
  .scrolled .seg { margin-top: 8px; }
  .head { border-radius: 22px; padding: 14px 16px 12px; }
  .title-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.02em; color: var(--ink); }
  .title-side { display: flex; align-items: center; gap: 10px; }
  .date { font-size: 13px; color: var(--body); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .ask { white-space: nowrap; min-height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--edge); background: var(--glass-strong); color: var(--ink); font-size: 13px; font-weight: 600; box-shadow: inset 0 1px 0 var(--edge-top); }
  .brief { margin: 8px 0 0; color: var(--strong); font-size: 14.5px; text-wrap: pretty; }
  .brief b { color: var(--ink); font-weight: 600; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-top: 12px; padding: 4px; border-radius: 14px; background: var(--track); }
  .seg button { border: 0; background: transparent; min-height: 36px; border-radius: 10px; font-size: 13px; font-weight: 500; white-space: nowrap; padding: 0 6px; color: var(--body); transition: background .18s ease-out, color .18s ease-out; }
  .seg button[aria-pressed="true"] { background: var(--glass-strong); color: var(--ink); box-shadow: inset 0 1px 0 var(--edge-top), 0 1px 6px rgba(0,0,0,.18); }
  /* the counts as bubbles (the owner, 2 Oct 2026: "make the bubble for needs you amber and the one for solved green") */
  .seg .n { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px; margin-left: 6px; border-radius: 999px; font-size: 11.5px; font-weight: 700; font-variant-numeric: tabular-nums; vertical-align: 1px; }
  .seg .n:empty { display: none; }
  #n-p { background: var(--badge); color: var(--badge-on); }
  #n-s { background: var(--primary); color: var(--primary-on); }
  .chip.need { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--warn) 45%, transparent); }
  .chip.done { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--primary) 45%, transparent); }

  main { padding: 4px 16px 0; display: grid; gap: 10px; max-width: 672px; margin: 0 auto; }
  .group { margin: 14px 2px 2px; font-size: 13px; font-weight: 600; color: var(--body); display: flex; justify-content: space-between; gap: 10px; }

  /* a thing */
  .item { background: var(--card); -webkit-backdrop-filter: blur(18px) saturate(160%); backdrop-filter: blur(18px) saturate(160%); border: 1px solid var(--edge); box-shadow: inset 0 1px 0 var(--edge-top); border-radius: 18px; padding: 13px 14px; scroll-margin-top: 190px; transition: background .2s ease-out, border-color .3s ease-out; }
  .item.flash { border-color: var(--primary); }
  .meta { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--body); margin-bottom: 6px; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--track); color: var(--strong); white-space: nowrap; }
  .chip.need { background: var(--warn-bg); color: var(--warn); }
  .chip.done { background: var(--ok-bg); color: var(--primary-ink); }
  .chip.info { background: var(--info-bg); color: var(--info); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .what { color: var(--ink); font-weight: 600; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
  .more { margin-top: 3px; color: var(--strong); white-space: pre-wrap; overflow-wrap: anywhere; }
  .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .act { min-height: 40px; padding: 8px 13px; border-radius: 12px; border: 1px solid var(--edge); background: var(--glass-strong); color: var(--ink); font-size: 14px; box-shadow: inset 0 1px 0 var(--edge-top); }
  .act.yes { background: var(--primary); border-color: transparent; color: var(--primary-on); font-weight: 600; box-shadow: none; }
  .act.quiet { background: transparent; box-shadow: none; color: var(--body); }
  .act:disabled { opacity: .45; }
  :is(.act, .seg button, .tab, .ask, .big, input, textarea, .pick):focus-visible { outline: 2px solid var(--primary-ink); outline-offset: 2px; }
  .answer { margin-top: 4px; font-size: 13.5px; color: var(--primary-ink); overflow-wrap: anywhere; }
  .was { margin-top: 4px; font-size: 13.5px; color: var(--body); overflow-wrap: anywhere; }

  /* solved: one quiet line, the answer kept; tap to open */
  .item.solved { padding: 10px 14px; background: color-mix(in srgb, var(--card) 55%, transparent); box-shadow: none; cursor: pointer; }
  .item.solved .what { font-weight: 500; color: var(--body); }
  .item.solved .more, .item.solved .acts { display: none; }
  .item.solved.open .more { display: block; color: var(--body); }
  .item.solved.open .acts { display: flex; }

  /* quiet rows (what was received) */
  .rows { background: var(--card); border: 1px solid var(--edge); border-radius: 18px; padding: 4px 12px; -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); }
  .row { display: flex; gap: 10px; align-items: baseline; padding: 9px 4px; border-bottom: 1px solid var(--edge); font-size: 14px; }
  .row:last-child { border-bottom: 0; }
  .row time { color: var(--body); font-size: 12.5px; font-variant-numeric: tabular-nums; min-width: 40px; }
  .row .txt { color: var(--strong); overflow-wrap: anywhere; white-space: pre-wrap; }

  /* a summary: one sub-head per machine */
  .sum h3 { margin: 12px 0 2px; font-size: 14.5px; font-weight: 700; color: var(--ink); display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .sum h3:first-of-type { margin-top: 2px; }
  .sum h3 span { font-weight: 500; color: var(--body); font-size: 13px; text-align: right; }
  .sum p { margin: 0; color: var(--strong); font-size: 14px; overflow-wrap: anywhere; }
  .sum .w { color: var(--warn); }

  /* machines */
  .mach { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: center; }
  .code { font-size: 20px; font-weight: 700; color: var(--ink); min-width: 44px; letter-spacing: -0.01em; }
  .who { color: var(--ink); font-weight: 600; }
  .where { color: var(--body); font-size: 13.5px; }
  .vol { text-align: right; color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .vol small { display: block; font-weight: 400; color: var(--body); font-size: 12.5px; }
  .steps { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }

  /* fuel */
  .fuel-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .gauge { position: relative; height: 12px; border-radius: 999px; background: var(--track); margin: 12px 2px 22px; }
  .gauge .fill { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: var(--primary); }
  .gauge .tick { position: absolute; top: -4px; width: 2px; height: 20px; border-radius: 2px; background: var(--ink); opacity: .75; }
  .gauge .lab { position: absolute; top: 20px; transform: translateX(-50%); font-size: 11.5px; color: var(--body); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .facts { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13.5px; color: var(--strong); }
  .facts b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }

  /* money totals */
  .totals { display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 10px; }
  .totals .k { font-size: 12.5px; color: var(--body); }
  .totals .v { font-size: 19px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .totals + .facts { margin-top: 10px; }

  /* the departments: a floating glass capsule */
  nav { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom)); z-index: var(--z-bar); width: min(calc(100% - 24px), 560px); border-radius: 28px; padding: 6px; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; scroll-snap-type: x proximity; }
  nav::-webkit-scrollbar { display: none; }
  .tab { position: relative; flex: 1 0 auto; min-width: 66px; scroll-snap-align: center; border: 0; background: transparent; border-radius: 22px; min-height: 54px; display: grid; place-items: center; gap: 2px; padding: 6px 8px; color: var(--body); font-size: 11.5px; font-weight: 500; transition: background .18s ease-out, color .18s ease-out; }
  .tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .tab[aria-current="page"] { background: var(--glass-strong); color: var(--ink); box-shadow: inset 0 1px 0 var(--edge-top), 0 2px 10px rgba(0,0,0,.2); }
  .badge { position: absolute; top: 4px; right: calc(50% - 26px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--badge); color: var(--badge-on); font-size: 11px; font-weight: 700; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
  .fab { position: fixed; right: calc(16px + env(safe-area-inset-right)); bottom: calc(92px + env(safe-area-inset-bottom)); z-index: var(--z-bar); min-height: 48px; padding: 0 18px; border-radius: 999px; color: var(--ink); font-weight: 600; }

  /* the sheets: say a cost · what was it · paste a text · ask the manager */
  dialog { z-index: var(--z-sheet); border: 1px solid var(--edge); border-radius: 22px 22px 0 0; background: var(--solid); color: var(--strong); width: 100%; max-width: 640px; margin: auto auto 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); max-height: 88dvh; overflow-y: auto; box-shadow: var(--shadow); }
  dialog::backdrop { background: rgba(3, 7, 18, .55); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  dialog h2 { margin: 0 0 4px; font-size: 17px; font-weight: 700; color: var(--ink); }
  .hint { font-size: 13px; color: var(--body); margin: 0 0 12px; }
  .label { font-size: 12.5px; font-weight: 500; color: var(--body); margin: 14px 0 6px; }
  .picks { display: flex; flex-wrap: wrap; gap: 6px; }
  .pick { font-size: 14px; min-height: 40px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--edge); background: transparent; color: var(--strong); }
  .pick[aria-pressed="true"] { background: var(--ok-bg); border-color: var(--primary); color: var(--primary-ink); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  input, textarea { font-size: 16px; width: 100%; min-height: 46px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--edge); background: var(--track); color: var(--ink); }
  textarea { min-height: 110px; resize: vertical; }
  input::placeholder, textarea::placeholder { color: var(--body); opacity: .8; }
  .preview { margin-top: 14px; padding: 10px 12px; border-radius: 12px; border: 1px dashed var(--edge); color: var(--ink); min-height: 44px; font-size: 15px; overflow-wrap: anywhere; }
  .sheet-actions { display: grid; grid-template-columns: auto 1fr; gap: 8px; margin-top: 14px; }
  .qa { margin-top: 14px; display: grid; gap: 10px; }
  .qa .q { color: var(--ink); font-weight: 600; }
  .qa .a { color: var(--strong); white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 2px; }
  .qa .wait { color: var(--body); font-style: italic; }
  .qa > div { padding-top: 10px; border-top: 1px solid var(--edge); }

  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(150px + env(safe-area-inset-bottom)); z-index: var(--z-toast); border-radius: 14px; padding: 10px 14px; font-size: 14px; color: var(--ink); opacity: 0; pointer-events: none; transition: opacity .2s ease-out; max-width: min(92vw, 460px); white-space: pre-wrap; }
  .toast.on { opacity: 1; }
  .empty { text-align: center; color: var(--body); padding: 36px 12px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="scroll">
<header id="bar" hidden><div class="head glass">
  <div class="title-row"><h1 id="title"></h1><div class="title-side"><span class="date" id="date"></span><button class="ask" id="ask">Ask</button></div></div>
  <p class="brief" id="brief"></p>
  <div class="seg" role="group" aria-label="Show">
    <button data-f="pending" aria-pressed="true">Needs you<span class="n" id="n-p"></span></button>
    <button data-f="solved" aria-pressed="false">Solved<span class="n" id="n-s"></span></button>

      <div><div class="label">Who (optional)</div><input id="who" autocomplete="off" placeholder="Brian"></div>
    </div>
    <div class="picks" id="crew" style="margin-top:8px"></div>
    <div class="two" id="route" hidden>
      <div><div class="label">From</div><input id="from" autocomplete="off" placeholder="China Mall"></div>
      <div><div class="label">To</div><input id="to" autocomplete="off" placeholder="Brookside One"></div>
    </div>
    <div class="label">Or type it yourself</div><input id="free" autocomplete="off" placeholder="Supper 200 each for Brian and Isaiah on A5">
    <div class="preview" id="preview" aria-live="polite"></div>
  </div>
  <div id="text-fields" hidden><textarea id="long" autocomplete="off"></textarea></div>
  <div id="owed-fields" hidden><div class="picks" id="owedkinds"></div></div>
  <div class="sheet-actions"><button class="act quiet" id="cancel">Cancel</button><button class="act yes" id="send">Send</button></div>

</dialog>
<div class="toast glass" id="toast" role="status"></div>

  try {
    const { status, data } = await api('reply', { body })
    if (status !== 200) { toast(data.error || 'The bot did not take it — try again.'); return false }
    if (!quiet) toast(data.reply || '✓'); await load(); return true
  } catch { toast('No connection — try again.'); return false } finally { busy = false }
}
document.addEventListener('click', async e => {
  const b = e.target.closest('button'), art = e.target.closest('.item.solved')
  if (b?.dataset.d) { dept = b.dataset.d; scroller.scrollTop = 0; return render() }
  if (b?.dataset.f) { filters[dept] = b.dataset.f; scroller.scrollTop = 0; return render() }
  if (b?.dataset.owed) { const id = Number(b.dataset.owed); owedSel.has(id) ? owedSel.delete(id) : owedSel.add(id); return render() }
  if (b?.dataset.owedact) {
    const os = owedGroups().get(b.dataset.g) || [], picked = os.filter(o => owedSel.has(o.id)), ids = (picked.length ? picked : os).map(o => o.id)
    if (!ids.length) return
    if (b.dataset.owedact === 'change') return openSheet({ owed: ids })
    b.disabled = true
    const ok = await say({ action: b.dataset.owedact === 'paid' ? 'owed_paid' : 'owed_dismiss', ids })
    if (ok) ids.forEach(i => owedSel.delete(i))
    return
  }
  if (b?.dataset.share) { const r = feed.rows.find(x => String(x.id) === b.dataset.share); if (r) { if (navigator.share) navigator.share({ text: r.body }).catch(() => {}); else { await navigator.clipboard.writeText(r.body); toast('Copied') } } return }
  if (b?.dataset.reopen) { const t = things.find(x => x.key === b.dataset.reopen); if (!t) return; b.disabled = true; opened.delete(t.key); await say({ action: 'reopen', id: t.r.id, item: t.item }); return }
  if (b?.dataset.k) {
    const t = things.find(x => x.key === b.dataset.k); if (!t) return
    const at = { id: t.r.id, item: t.item }
    if (b.dataset.mark) { b.disabled = true; return say({ action: 'mark', ...at }) }
    if (b.dataset.cost) { b.disabled = true; return say({ action: 'attach', ...at, receipt: t.r.data?.receipt, cost: Number(b.dataset.cost) }) }
    if (b.dataset.b !== undefined) {   // a button under one issue of an alert
      const a = t.buttons[Number(b.dataset.b)]; if (!a) return
      if (a.share) { if (navigator.share) { try { await navigator.share({ text: a.share }) } catch { return } } else { await navigator.clipboard.writeText(a.share); toast('Copied — paste it in his group') } }
      b.disabled = true
      return say({ action: 'issue', machine: a.machine, day: a.day, fp: a.fp, answer: a.answer, issue: t.what, ...at })
    }
    const a = t.plain[Number(b.dataset.i)]; if (!a) return
    if (a.compose) return openSheet({ ...a.compose, ...at, who: (t.r.data && t.r.data.payee) || null, day: a.day || (t.r.data && t.r.data.day) || null })
    b.disabled = true
    return say(a.action ? { ...a, ...at } : { text: a.text, receipt: a.receipt, ...at })
  }
  if (art && !b) { const k = art.dataset.key; opened.has(k) ? opened.delete(k) : opened.add(k); art.classList.toggle('open') }
})

// ── the sheet: say a cost (machine + kind + amount, or free text) · what a payment was · paste an M-Pesa text · ask the manager ──
function picks(el, items, get, set, keep = false) { el.innerHTML = items.map(x => `<button class="pick" aria-pressed="${get() === x}" data-v="${esc(x)}">${esc(x)}</button>`).join(''); el.onclick = e => { const c = e.target.closest('.pick'); if (!c) return; if (keep && get() === c.dataset.v) return; set(get() === c.dataset.v ? null : c.dataset.v); picks(el, items, get, set, keep); preview() } }
function composed() {
  if (compose.mode !== 'cost') return $('long').value.trim()
  const free = $('free').value.trim(); if (free) return free
  const k = KINDS.find(x => x[0] === compose.kind); const amt = $('amount').value.replace(/[^\d.]/g, ''); const who = $('who').value.trim() || compose.who
  if (!k || !amt) return ''
  return [k[2] ? compose.machine : null, k[1], Number(amt).toLocaleString('en-US'), who ? `for ${who}` : null].filter(Boolean).join(' ')
}
const dayWords = () => { const d = lastDays().find(x => x.iso === compose.day); return d && d.label !== 'Today' ? ` · ${d.label}${compose.shift === 'night' ? ' (night)' : ''}` : compose.shift === 'night' ? ' · tonight' : '' }
// a move between sites has a from and a to ("it would help if selecting between sites spawned from and to boxes")
const routeWords = () => { const f = $('from').value.trim(), t = $('to').value.trim(); return compose.kind === 'Between sites' && (f || t) ? ` · ${f || '?'} → ${t || '?'}` : '' }
function preview() {
  if (compose.mode === 'owed') { $('send').disabled = !compose.code; return }
  $('route').hidden = compose.kind !== 'Between sites'
  const t = composed(); $('preview').textContent = t ? t + routeWords() + dayWords() : 'Pick a kind and an amount.'; $('send').disabled = !t && compose.mode !== 'business'
}
// the men on the chosen machine's registers of the chosen day — the payment's payee first when he is one of them
async function crew() {
  const el = $('crew'); if (!compose.machine || !compose.day) { el.innerHTML = ''; return }
  const k = compose.machine + '|' + compose.day
  if (!crews[k]) { el.innerHTML = '<span class="chip">looking at the registers…</span>'; const { data } = await api(`crew&machine=${encodeURIComponent(compose.machine)}&day=${compose.day}`).catch(() => ({ data: null })); crews[k] = (data && data.names) || [] }
  const names = crews[k]
  if (compose.who && !names.some(n => n.name === compose.who)) compose.who = null
  el.innerHTML = names.length ? names.map(n => `<button class="pick" aria-pressed="${compose.who === n.name}" data-v="${esc(n.name)}">${esc(n.name)}</button>`).join('') : `<span class="chip">no register for ${esc(compose.machine)} that day</span>`
  el.onclick = e => { const c = e.target.closest('.pick'); if (!c) return; compose.who = compose.who === c.dataset.v ? null : c.dataset.v; $('who').value = ''; crew(); preview() }
  preview()
}
function openSheet(pre = {}) {
  const mode = pre.owed ? 'owed' : pre.ask ? 'ask' : pre.paste ? 'paste' : pre.bucket === 'business' ? 'business' : 'cost'
  compose = { mode, machine: pre.machine || null, kind: null, receipt: pre.receipt || null, id: pre.id || null, item: pre.item || 0, day: pre.day || lastDays()[0].iso, shift: pre.shift === 'night' ? 'night' : 'day', who: pre.who || null }
  $('amount').value = pre.amount ? Number(pre.amount).toLocaleString('en-US') : ''; $('who').value = ''; $('free').value = ''; $('long').value = ''
  $('cost-fields').hidden = mode !== 'cost'; $('text-fields').hidden = mode === 'cost' || mode === 'owed'; $('owed-fields').hidden = mode !== 'owed'; $('qa').hidden = mode !== 'ask'
  $('from').value = ''; $('to').value = ''; compose.ids = pre.owed || null; compose.code = null
  const amt = pre.amount ? `KES ${Number(pre.amount).toLocaleString('en-US')}` : ''
  if (mode === 'cost') {
    $('sheet-title').textContent = pre.receipt ? 'What was this payment for?' : 'Say a cost'
    $('sheet-hint').textContent = pre.receipt ? `M-Pesa ${pre.receipt} · ${amt} — your answer is attached to this receipt.` : 'Pick the machine and the kind; the bot reads it as if you had dictated it.'
    const days = lastDays()
    picks($('days'), days.map(d => d.label), () => (days.find(d => d.iso === compose.day) || {}).label, v => { compose.day = (days.find(d => d.label === v) || days[0]).iso; crew() }, true)
    picks($('shifts'), ['Day shift', 'Night shift'], () => compose.shift === 'night' ? 'Night shift' : 'Day shift', v => { compose.shift = v === 'Night shift' ? 'night' : 'day' }, true)
    picks($('machines'), feed.machines || [], () => compose.machine, v => { compose.machine = v; crew() })
    picks($('kinds'), KINDS.map(k => k[0]), () => compose.kind, v => compose.kind = v)
    crew()
  } else if (mode === 'owed') {
    const kinds = feed.kinds || {}
    $('sheet-title').textContent = 'What were these for?'
    $('sheet-hint').textContent = `${compose.ids.length} line${compose.ids.length === 1 ? '' : 's'} on the owed list — the register's word is replaced by yours; a payment is then matched to this kind.`
    picks($('owedkinds'), Object.values(kinds), () => kinds[compose.code], v => { compose.code = Object.keys(kinds).find(k => kinds[k] === v) || null })
  } else if (mode === 'business') {
    $('sheet-title').textContent = 'Other business — what was it?'
    $('sheet-hint').textContent = `M-Pesa ${pre.receipt} · ${amt} — filed under Other (Business), off the machines' books. A word on what it was helps later (rent, licence…).`
    $('long').placeholder = 'Rent for the yard'
  } else if (mode === 'paste') {
    $('sheet-title').textContent = 'Paste the M-Pesa text'
    $('sheet-hint').textContent = 'Copy the whole message from Messages (from the receipt code) and paste it here. Several at once is fine.'
    $('long').placeholder = 'UJ1DA8XXXX Confirmed. Ksh200.00 sent to …'
  } else {
    $('sheet-title').textContent = dept === 'all' ? 'Ask about today' : `Ask the ${DEPTS[dept].tab.toLowerCase()} manager`
    $('sheet-hint').textContent = 'It reads this department\'s week from the bot\'s own records and answers in a minute or two — here and as a notification.'
    $('long').placeholder = dept === 'fuel' ? 'Which machine went down most overnight this week?' : dept === 'money' ? 'What did I spend on fuel today, by machine?' : 'What is still open from today?'
    thread()
  }
  preview(); $('sheet').showModal()
}
function thread() { const qs = (feed.questions || []).filter(q => q.department === dept); $('qa').innerHTML = qs.map(q => `<div><div class="q">${esc(q.question)}</div><div class="a ${q.status === 'asked' ? 'wait' : ''}">${q.status === 'asked' ? 'Thinking…' : esc(q.answer || 'No answer — ask again.')}</div></div>`).join('') }
// the header folds once the page is well scrolled and opens again only near the top (the fold itself moves the page: no flicker)
scroller.addEventListener('scroll', () => { const c = document.body.classList, y = scroller.scrollTop; if (!c.contains('scrolled') && y > 140) c.add('scrolled'); else if (c.contains('scrolled') && y < 16) c.remove('scrolled') }, { passive: true })
// the keyboard: iOS slides the whole window up for a field and can leave it there when the keyboard closes — put it back, so the bar
// is at the bottom again
const settle = () => { if (window.scrollY || window.scrollX) window.scrollTo(0, 0) }
addEventListener('focusout', () => setTimeout(settle, 60))
window.visualViewport?.addEventListener('resize', () => { if (!document.activeElement || !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) settle() })
$('fab').onclick = () => openSheet()
$('ask').onclick = () => openSheet({ ask: true })
$('cancel').onclick = () => $('sheet').close()
for (const id of ['amount', 'who', 'free', 'long', 'from', 'to']) $(id).oninput = preview
$('send').onclick = async () => {
  const text = composed(), at = compose.id ? { id: compose.id, item: compose.item } : {}
  if (!text && compose.mode !== 'business' && compose.mode !== 'owed') return
  $('send').disabled = true
  const route = compose.kind === 'Between sites' ? { from: $('from').value.trim() || undefined, to: $('to').value.trim() || undefined } : {}
  const ok = compose.mode === 'owed' ? await say({ action: 'owed_change', ids: compose.ids, code: compose.code })
    : compose.mode === 'business' ? await say({ action: 'business', receipt: compose.receipt, note: text, ...at })
    : compose.mode === 'ask' ? await say({ action: 'ask', department: dept, question: text })
    : await say({ text, receipt: compose.receipt, day: compose.day, shift: compose.shift, ...route, ...at })
  if (ok) { if (compose.mode === 'owed') owedSel.clear(); if (compose.mode === 'ask') { $('long').value = ''; thread() } else $('sheet').close() }
  $('send').disabled = false
}
start()
</script>
</body>
</html>
